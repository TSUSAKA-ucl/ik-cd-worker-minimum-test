<!doctype html>
<html lang="en">
<html>
  <head>
    <script type="module">
      import './style.css'
      import AFRAME from 'aframe'
      import '@ucl-nuee/robot-loader/robotRegistry.js';
      import '@ucl-nuee/robot-loader/robotLoader.js';
      import '@ucl-nuee/robot-loader/ikWorker.js';
      import '@ucl-nuee/robot-loader/reflectJointLimits.js';
      import '@ucl-nuee/robot-loader/reflectCollision.js';
      import '@ucl-nuee/robot-loader/armMotionUI.js';
      import '@ucl-nuee/robot-loader/vrControllerThumbMenu.js';
      import '@ucl-nuee/robot-loader/fingerCloser.js';
      import '@ucl-nuee/robot-loader/ignoreCollision.js';
      import '@ucl-nuee/robot-loader/addFrameToJoints.js';
      import '@ucl-nuee/ik-cd-worker/IkWorkerParamsComponents.js';
      import '@ucl-nuee/robot-loader/oneAxisMover.js';
    </script>
  </head>
  <body>
    <a-scene  xr-mode-ui="XRMode: xr" >
      <a-entity id="robot-registry"
                robot-registry >
        <a-entity right-controller
                  laser-controls="hand: right"
                  thumbstick-menu="items: right-piper; laser: false"
                  target-selector="id: right-piper"
                  event-distributor
                  visible="false">
        </a-entity>
        <a-entity left-controller
                  laser-controls="hand: left"
                  thumbstick-menu="items: left-piper; laser: false"
                  target-selector="id: left-piper"
                  event-distributor
                  visible="false">
        </a-entity>
      </a-entity>

      <a-plane id="right-piper"
               position="0.2 1 -1" rotation="-90 0 90"
               width="0.04" height="0.04" color="blue"
               robot-loader="model: piper"
               ik-worker="0.20, 1.57, -0.79, 0, 0.79, 0"
               reflect-collision="color: yellow"
               exact_solution="exact: false"
               reflect-joint-limits
               joint-limit-keep-moving-mask="mask: 0, 0, 0, 1, 1, 1"
               arm-motion-ui
	       >
	<a-entity id="right-finger7"
		  robot-loader="model: piper-finger7"
		  ik-worker=""
                  attach-to-another="to: right-piper;event: a,b,x,y"
		  one-axis-mover="axis: 0,-1,0; posiMax:0.035"
		  />
	<a-entity id="right-finger8"
		  robot-loader="model: piper-finger8"
		  ik-worker=""
                  attach-to-another="to: right-piper;event: a,b,x,y"
		  one-axis-mover="axis: 0,1,0; posiMax:0.035"
		  />
      </a-plane>
      <a-plane id="left-piper"
               position="-0.2 1 -1" rotation="-90 0 90"
               width="0.04" height="0.04" color="blue"
               robot-loader="model: piper"
               ik-worker="-0.20, 1.57, -0.79, 0, 0.79, 0"
               reflect-collision="color: yellow"
               exact_solution="exact: false"
               reflect-joint-limits
               set-joint-limit-keep-moving="true"
               arm-motion-ui
               >
	<a-entity id="left-finger7"
		  robot-loader="model: piper-finger7"
		  ik-worker=""
                  attach-to-another="to: left-piper;event: a,b,x,y"
		  one-axis-mover="axis: 0,-1,0; posiMax:0.035; posiEvent:ybuttondown; posiStopEvent:ybuttonup; negaEvent:xbuttondown; negaStopEvent:xbuttonup"
		  />
	<a-entity id="left-finger8"
		  robot-loader="model: piper-finger8"
		  ik-worker=""
                  attach-to-another="to: left-piper;event: a,b,x,y"
		  one-axis-mover="axis: 0,1,0;  posiMax:0.035; posiEvent:ybuttondown; posiStopEvent:ybuttonup; negaEvent:xbuttondown; negaStopEvent:xbuttonup"
		  />
      </a-plane>
    </a-scene>
  </body>
</html>
