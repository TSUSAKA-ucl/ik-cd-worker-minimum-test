<!doctype html>
<html lang="en">
<html>
  <head>
    <meta charset="utf-8">
    <title>piper A-Frame WebRTC NVENC</title>
    <script type="module">
      import './style.css'
      import AFRAME from 'aframe'
      import '@ucl-nuee/ik-cd-worker/IkWorkerParamsComponents.js';
      import '@ucl-nuee/robot-loader/armMotionUI.js';
      import '@ucl-nuee/robot-loader/attachToAnother.js';
      import '@ucl-nuee/robot-loader/axesFrame.js';
      import '@ucl-nuee/robot-loader/baseMover.js';
      import '@ucl-nuee/robot-loader/changeOpacity.js';
      import '@ucl-nuee/robot-loader/ignoreCollision.js';
      import '@ucl-nuee/robot-loader/ikWorker.js';
      import '@ucl-nuee/robot-loader/jointMoveTo.js';
      import '@ucl-nuee/robot-loader/multipleTogether.js';
      import '@ucl-nuee/robot-loader/oneAxisMover.js';
      import '@ucl-nuee/robot-loader/reflectCollision.js';
      import '@ucl-nuee/robot-loader/reflectJointLimits.js';
      import '@ucl-nuee/robot-loader/reflectWorkerJoints.js';
      import '@ucl-nuee/robot-loader/robotLoader.js';
      import '@ucl-nuee/robot-loader/robotRegistry.js';
      import '@ucl-nuee/robot-loader/stillObjects.js';
      import '@ucl-nuee/robot-loader/vrControllerThumbMenu.js';
      import './followCamera.js';
    </script>
  </head>
  <body>
    <a-scene  xr-mode-ui="XRMode: xr" >
      <a-assets>
	<!-- 映像を流し込むためのVideo要素 -->
	<video id="edge-video" autoplay playsinline muted crossOrigin="anonymous"
	       >
	</video>
      </a-assets>
      <!-- 映像を表示する3Dオブジェクト（16:9の比率） -->
      <!-- RealSense D435i -->
      <!-- (calibrated)fLength->884.134 -->
      <!-- cx->629.752746582031, cy->356.769989013672 -->
      <!-- 629.7...-1280/2 = -10.247..., 356.7...-720/2 = -3.23001... -->
      <!-- e.g. width=12.80, height=7.20,  -->
      <!-- camX = -0.10247 camY = -0.0323 camZ = -8.84134 -->
      <a-plane id="screen"
	       follow-camera="position: -0.10247 0.0323 -8.84134; rotation: 0 0 0"
	       width="12.80" height="7.20"
	       material="src: #edge-video; shader: flat;"></a-plane>
      <a-entity id="robot-registry"
                robot-registry >
        <a-entity right-controller
                  laser-controls="hand: right"
                  thumbstick-menu="items: right-piper,dual-controller,right-piper; laser: false"
                  target-selector="id: right-piper"
                  event-distributor
                  visible="false">
        </a-entity>
        <a-entity left-controller
                  laser-controls="hand: left"
                  thumbstick-menu="items: left-piper,dual-controller,left-piper; laser: false"
                  target-selector="id: left-piper"
                  event-distributor
                  visible="false">
        </a-entity>
      </a-entity>

      <!-- ik-worker="-0.40, 1.57, -1.57, 0, 0.79, 0" -->
      <a-plane id="right-piper"
	       follow-camera="position: 0.336708 -0.248462 -0.531728; quaternion: 0.38977 -0.361008 -0.623631 -0.573442"
               width="0.04" height="0.04" color="blue"
               robot-loader="model: piper"
	       ik-worker="0.0, 2.1, -1.0, -0.5, -1.0, -1.57"
               reflect-collision="color: yellow"
               exact_solution="exact: false"
               reflect-joint-limits
               joint-limit-keep-moving-mask="mask: 0, 0, 0, 1, 1, 1"
               arm-motion-ui
	       >
	       <!-- attach-opacity-recursively="opacity: 0.25" -->
	<a-entity id="right-finger7"
		  position="0 -0.005 0"
		  robot-loader="model: piper-finger7"
		  ik-worker=""
                  attach-to-another="to: right-piper;event: a,b,x,y"
                  ignore-collision__a="other:right-piper; data: 0/6, 0/7"
		  one-axis-mover="axis: 0,-1,0; posiMax:0.035"
	/>
	<a-entity id="right-finger8"
		  position="0 0.005 0"
		  robot-loader="model: piper-finger8"
		  ik-worker=""
                  attach-to-another="to: right-piper;event: a,b,x,y"
                  ignore-collision__a="other:right-piper; data: 0/6, 0/7"
                  ignore-collision__b="other:right-finger7; data: 0/0, 0/1, 1/0, 1/1"
		  one-axis-mover="axis: 0,1,0; posiMax:0.035"
	/>
      </a-plane>

      <a-plane id="left-piper"
               position="-0.3 1 -1" rotation="-90 0 90"
               width="0.24" height="0.04" color="blue"
	       >
      </a-plane>
      <a-entity id="dual-controller"
		a-axes-frame="length: 0.15; radius: 0.010; color: red"
		reserve-multiple-together="targets: right-piper, left-piper"
		/>
    </a-scene>

  <script type="module">
    import './followCamera.js';
    import { startWebRTC } from './startWebRTC.js';
    // A-Frameシーン読み込み完了後に実行
    document.querySelector('a-scene').addEventListener('loaded', () => {
      startWebRTC("edge-video");
    });
  </script>
  </body>
</html>
